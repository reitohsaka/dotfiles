# Font
font_family      family="DepartureMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 10

# Cursor
cursor_shape beam

# Scrollback
scrollback_indicator_opacity 0.0

# Window layout
remember_window_size no
initial_window_width 95c
initial_window_height 25c
window_padding_width 2 6 2 6

# Color scheme
foreground #FCFCFC
background #232627
